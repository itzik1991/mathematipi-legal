<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>איפוס סיסמה - מתמטיפאי</title>
<!--
  Landing page for the Supabase password-recovery e-mail.

  DEPLOY: upload this file to the GitHub Pages repo itzik1991/mathematipi-legal, next to
  privacy-policy.html, so it is served at
      https://itzik1991.github.io/mathematipi-legal/reset-password.html
  That exact URL must also be added in Supabase -> Authentication -> URL Configuration ->
  Redirect URLs. Without it Supabase falls back to the project's Site URL and the token is wasted.

  It has to be a WEB page rather than a link into the app: MathematiPi is a Capacitor WebView on a
  hash router with no registered deep-link scheme, so a link back into the app would dead-end.

  The Supabase keys below are the PUBLIC anon key and project URL - the same pair that already
  ships inside the APK. Safety comes from Row Level Security on the server, not from hiding them.
  If the project is ever rotated, update the two constants in the script at the bottom.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #161209; color: #f4ecda;
    font-family: Rubik, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 400px; background: #211b12; border: 1px solid #362c1d;
    border-radius: 20px; padding: 28px 24px; text-align: center;
  }
  h1 { font-size: 21px; font-weight: 800; margin: 0 0 6px; }
  p { font-size: 14.5px; line-height: 1.65; color: #bdb3a3; margin: 0 0 18px; }
  label { display: block; text-align: right; font-size: 13px; font-weight: 700; margin: 0 0 6px; }
  input {
    width: 100%; padding: 14px 16px; border-radius: 14px; background: #161209;
    border: 2px solid #3d3323; color: #f4ecda; font-size: 16px; font-weight: 600;
    font-family: inherit; outline: none; direction: ltr; text-align: left;
  }
  input:focus { border-color: #7b61ff; }
  button {
    width: 100%; margin-top: 16px; padding: 14px 18px; border: 0; border-radius: 14px;
    background: #7b61ff; color: #fff; font-size: 16px; font-weight: 800;
    font-family: inherit; cursor: pointer; min-height: 50px;
  }
  button:disabled { opacity: .55; cursor: default; }
  .msg { font-size: 13.5px; font-weight: 700; margin-top: 14px; line-height: 1.6; }
  .bad { color: #ff8a80; }
  .good { color: #7ee2a8; }
  .hint { font-size: 12px; color: #6f6858; margin-top: 18px; }
  .pi { font-size: 40px; line-height: 1; margin-bottom: 10px; }
</style>
</head>
<body>
  <main class="card">
    <div class="pi" aria-hidden="true">π</div>
    <h1>בחירת סיסמה חדשה</h1>
    <p id="lead">בחרו סיסמה חדשה לחשבון מתמטיפאי שלכם.</p>

    <form id="form">
      <label for="pw">סיסמה חדשה (6 תווים לפחות)</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="6" required>
      <label for="pw2" style="margin-top:12px">אימות הסיסמה</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>
      <button id="go" type="submit">עדכון הסיסמה</button>
    </form>

    <div id="msg" class="msg" role="status" aria-live="polite"></div>
    <div class="hint">אחרי העדכון חזרו לאפליקציה והתחברו עם הסיסמה החדשה.</div>
  </main>

<script type="module">
// Filled in by `node scripts/build-reset-page.mjs`, which reads .env.local and writes the
// deployable copy. They stay as placeholders in the repo so no value from .env.local is ever
// committed - even though both are public by design and already ship inside the APK.
const SUPABASE_URL = 'https://pdhmqvuiehwrqewoddsu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_IGhSMSmJazQpfDmEM6eYZA_McF_DFX3';

// NO THIRD-PARTY CODE ON THIS PAGE. It used to `import { createClient } from 'https://esm.sh/...@2'`
// - an unpinned major version, no Subresource Integrity, on the one page in the whole product that
// holds a live password-recovery token and reads the new password the student types. Whoever
// served that request could run arbitrary code right there. (Found by the 2026-08-07 privacy
// audit, which went looking for undisclosed sub-processors and found a security hole instead.)
//
// The SDK was used for exactly ONE call - auth.updateUser({password}) - which is a single REST
// request. So the dependency is gone rather than vendored: nothing here loads from any host but
// Supabase itself, and there is no bundle to keep patched.
const form = document.getElementById('form');
const msg  = document.getElementById('msg');
const lead = document.getElementById('lead');
const go   = document.getElementById('go');
const say  = (text, cls) => { msg.textContent = text; msg.className = 'msg ' + (cls || ''); };

// The app requests recovery with the IMPLICIT flow (see the flowType note in src/lib/cloud.js),
// so Supabase puts the recovery token straight in the URL fragment and we read it here. Nothing
// is stored: the token lives in this variable for the length of one request and the page keeps no
// session behind it.
let ready = false;
let accessToken = null;
const frag = new URLSearchParams(location.hash.slice(1));
if (frag.get('error_description')) {
  form.style.display = 'none';
  lead.textContent = 'הקישור אינו תקף יותר.';
  say('קישורי איפוס תקפים לזמן מוגבל ולשימוש אחד. בקשו קישור חדש מתוך האפליקציה.', 'bad');
} else if (frag.get('access_token')) {
  accessToken = frag.get('access_token');
  ready = true;
  // Drop the token from the address bar so it does not sit in history, in a screenshot, or get
  // copied along with the URL. We already hold it in memory.
  history.replaceState(null, '', location.pathname + location.search);
} else {
  form.style.display = 'none';
  lead.textContent = 'הדף הזה נפתח מתוך קישור במייל.';
  say('פתחו את הקישור שנשלח אליכם במייל מ"מתמטיפאי" כדי לבחור סיסמה חדשה.', 'bad');
}

// The single call the SDK used to make: PUT /auth/v1/user with the recovery token as the bearer.
// Returns { error } shaped like the SDK's so the Hebrew error mapping below is unchanged.
async function updatePassword(password) {
  try {
    const r = await fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + accessToken,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ password }),
    });
    if (r.ok) return { error: null };
    let m = '';
    try { const j = await r.json(); m = j.msg || j.message || j.error_description || j.error || ''; }
    catch (e) { m = ''; }
    if (!m && (r.status === 401 || r.status === 403)) m = 'session missing or expired';
    return { error: { message: m || ('HTTP ' + r.status) } };
  } catch (e) {
    return { error: { message: 'network' } };
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!ready) return;
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  if (pw.length < 6) return say('הסיסמה חייבת להכיל 6 תווים לפחות.', 'bad');
  if (pw !== pw2)    return say('שתי הסיסמאות אינן זהות.', 'bad');

  go.disabled = true; say('מעדכן…');
  try {
    const { error } = await updatePassword(pw);
    if (error) {
      // Every other line on this page is Hebrew; this branch used to paste Supabase's English
      // straight in, at the very end of the only account-recovery path there is. The realistic
      // one is "same password" - the student forgot it, so of course they try the old one.
      const m = String(error.message || '');
      const he = /different from the old/i.test(m) ? 'הסיסמה החדשה חייבת להיות שונה מהקודמת.'
        : /session missing|expired|invalid|not found/i.test(m) ? 'הקישור פג. בקשו קישור חדש מתוך האפליקציה ("שכחתי סיסמה").'
        : /known to be weak|should contain|weak/i.test(m) ? 'הסיסמה חלשה מדי - בחרו סיסמה אחרת.'
        : /for security purposes|rate|too many|after \d+ seconds?/i.test(m) ? 'יותר מדי נסיונות - נסו שוב בעוד דקה.'
        : /network/i.test(m) ? 'אין חיבור לאינטרנט. בדקו את החיבור ונסו שוב.'
        : 'העדכון נכשל. נסו שוב בעוד רגע.';
      go.disabled = false;
      return say(he, 'bad');
    }
    form.style.display = 'none';
    lead.textContent = 'הסיסמה עודכנה בהצלחה ✓';
    say('אפשר לחזור לאפליקציה ולהתחבר עם הסיסמה החדשה.', 'good');
    await supabase.auth.signOut();
  } catch (err) {
    go.disabled = false;
    say('אירעה תקלה. נסו שוב בעוד רגע.', 'bad');
  }
});
</script>
</body>
</html>
